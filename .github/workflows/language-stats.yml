name: Refresh repository languages

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:17 UTC; scheduled runs use the default branch (main).
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: language-stats-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate public repository language assets
        env:
          # Automatic token for public API rate limits; no personal token needed.
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_language_stats.py
      - name: Commit only the generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/languages.svg assets/languages-mobile.svg assets/languages.json
          if git diff --cached --quiet -- assets/languages.svg assets/languages-mobile.svg assets/languages.json; then
            echo 'No language asset changes.'
            exit 0
          fi
          git commit -m 'chore: refresh aggregate repository language stats' --only -- assets/languages.svg assets/languages-mobile.svg assets/languages.json
          git push origin HEAD:main
